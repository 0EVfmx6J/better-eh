name: Build release

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.event.release.id }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Verify release version
        run: |
          version="$(node -p "require('./apps/userscript/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$version" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag must be $version or v$version to match apps/userscript/package.json."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: better-eh-userscript
          path: |
            apps/userscript/dist/better-eh.user.js
            apps/userscript/dist/better-eh.meta.js
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: better-eh-userscript
          path: release-assets

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$GITHUB_REF_NAME" \
            release-assets/better-eh.user.js release-assets/better-eh.meta.js
